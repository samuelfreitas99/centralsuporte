services:
  db:
    image: postgres:16-alpine
    container_name: centralsuporte_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suporte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suporte_password}
      POSTGRES_DB: ${POSTGRES_DB:-centralsuporte_db}
    volumes:
      - centralsuporte_pgdata:/var/lib/postgresql/data
    networks:
      - centralsuporte_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suporte} -d ${POSTGRES_DB:-centralsuporte_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: centralsuporte_backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8088:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-suporte}:${POSTGRES_PASSWORD:-suporte_password}@db:5432/${POSTGRES_DB:-centralsuporte_db}
      - SECRET_KEY=${SECRET_KEY:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - CENTRAL_VAULT_KEY=${CENTRAL_VAULT_KEY:-}
      - OTRS_TICKET_URL=${OTRS_TICKET_URL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - centralsuporte_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: centralsuporte_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - centralsuporte_network

volumes:
  centralsuporte_pgdata:
    name: centralsuporte_pgdata

networks:
  centralsuporte_network:
    name: centralsuporte_network
    driver: bridge
