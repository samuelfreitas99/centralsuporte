# Produção: o mesmo app em HTTP (porta 80 -> 5173 no host) e HTTPS (443 -> 8443 no host).
# /api/ é repassado ao backend: navegador e API ficam na mesma origem (sem porta 8088 e sem CORS).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;   # anexos até 25 MB (MAX_ATTACHMENT_SIZE_MB)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Service worker e manifesto: sempre a versão mais nova
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Certificado da CA interna para instalar nos PCs (link na tela de login)
    location = /ca.crt {
        alias /etc/nginx/certs/ca.crt;
        default_type application/x-x509-ca-cert;
    }

    # SPA (navegação por hash): qualquer rota cai no index.html, que nunca é cacheado
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
