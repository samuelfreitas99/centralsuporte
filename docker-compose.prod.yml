# Modo produção (override). Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Diferenças em relação ao desenvolvimento:
#   - backend sem --reload, código vindo da imagem; aplica migrações ao iniciar
#   - frontend compilado (Vite build) servido por nginx na mesma porta 5173
#   - uploads continuam persistidos em ./backend/uploads
services:
  backend:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes: !override
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports: !override
      - "5173:80"
    volumes: !reset []
    environment: !reset []
